name: roundelay
description: >-
  Reference client library for the roundelay protocol: the v1 envelope, the
  padding ladder, domain framing, and the Ed25519 verification a pulling device
  performs because the server deliberately does not.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  crypto: ^3.0.3
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
