name: Spec

# This branch is the normative specification and carries no implementation, so
# there is nothing here to build or test. What it can be held to is that the
# checklist is well formed and internally consistent — which is what the
# conformance lint decides.
#
# The lint itself lives on `dev`, because it is Go. That cross-branch reach is
# the honest shape of the dependency today: there is exactly one lint and the
# spec branch cannot compile it. It is checked out read-only below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: conformance lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out the spec
        uses: actions/checkout@v7
        with:
          path: spec

      - name: check out the lint
        uses: actions/checkout@v7
        with:
          ref: dev
          path: tool

      - uses: actions/setup-go@v7
        with:
          go-version-file: tool/go.mod
          cache-dependency-path: tool/go.sum

      # All five lints. Until LOO-24 this ran three of them, because `coverage`
      # and `bindings` do not decide this checklist against itself — they decide
      # it against `dev`'s compiled refusal vocabulary and against `dev`'s
      # collected tests, and while the two branches carried different specs
      # those two were guaranteed red about the divergence rather than about the
      # document. `dev` now consumes this branch's spec instead of maintaining
      # its own, so there is one checklist, and all five are answerable.
      #
      # That makes this job the place the divergence would reappear: if someone
      # edits the spec here without the implementation following, `coverage` and
      # `bindings` go red here, on the commit that caused it.
      - name: conformance lint
        working-directory: tool
        run: |
          go run ./internal/conformance/cmd/conformance-lint \
            ../spec/conformance/checklist.yaml
