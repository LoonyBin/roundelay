  subject: server
  observable: black-box
  codes: [workspace_quota_exhausted]
  test: tests/conformance/test_quota.py::test_a_prune_batch_lands_under_a_closed_ceiling

- id: CONF-QUOTA-004
  requirement: >
    The exemption does not survive batching: a batch mixing a hard_prune with a content
