  observable: black-box
  codes: [control_chain_break]
  test: tests/conformance/test_races.py::test_concurrent_control_ops

- id: CONF-CTL-014
  requirement: >
    A re-posted control op whose link is now stale answers duplicate=true, never
    control_chain_break.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [control_chain_break]
  test: tests/conformance/test_authority.py::test_a_stale_repeat_is_a_duplicate_not_a_break

- id: CONF-CTL-015
  requirement: >
    Before a genesis the tip comparison is not asked: a member_register carrying a
    well-formed non-zero prev_control_hash into a Workspace with no genesis answers
    409 workspace_not_created and never control_chain_break, while the same op
    carrying a zero link answers control_chain_break with no
    expected_prev_control_hash field.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [control_chain_break, workspace_not_created]
  test: tests/conformance/test_authority.py::test_before_a_genesis_the_tip_is_not_asked

- id: CONF-CTL-018
  requirement: >
    A role_table is signed by the current Root itself: one Root signed is accepted from
    an author holding no grant at all, since a Root-signed control payload needs none,
    and one a live delegate signed is refused 422 bad_root_signature — the same verdict
    delegate, revoke_delegation, workspace_genesis and root_handover give.
  spec: "docs/03-authority.md §6, §7"
  subject: server
  observable: black-box
  codes: [bad_root_signature]
  test: tests/conformance/test_authority.py::test_a_role_table_is_roots_own

- id: CONF-CTL-019
  requirement: >
    Every malformed_role_table case is decided from the certificate's own bytes and sits
    above the signature, so a table that is both misshapen and signed by the wrong key
    answers malformed_role_table and never bad_root_signature: an entry whose key set is
    not the closed three, a role token failing ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ or
    outside 1-32 bytes, a repeated role token, a classes member that is not an integer
    in 0-255 or is repeated, a prune_types member outside {prune, prune_ext, hard_prune}
    or repeated, a non-empty prune_types on an entry whose classes does not name 129,
    a table without exactly one entry named owner, and an entry other than owner naming
    128. cert_workspace_mismatch still precedes it.
  spec: "docs/03-authority.md §10"
  subject: server
  observable: black-box
  codes: [malformed_role_table, cert_workspace_mismatch, bad_root_signature]
  test: tests/conformance/test_authority.py::test_malformed_role_tables

- id: CONF-CTL-020
  requirement: >
    The table in force at a position is the one carried by the latest role_table op
    strictly below it, and the profile's initial table where there is none: within one
    batch, an op after a role_table is judged against the table that role_table carries,
    and an op accepted before a narrowing role_table is never retroactively refused — it
    stays in the log and serves unchanged. A role a later table stops naming leaves its
    grants live and unrevoked, while later ops from a device holding one answer 403
    role_forbids_op_class carrying that token among the lexicographically sorted roles,
    never unknown_role.
  spec: "docs/03-authority.md §7, §11"
  subject: server
  observable: black-box
  codes: [role_forbids_op_class, unknown_role]
  test: tests/conformance/test_authority.py::test_the_table_in_force_is_positional

- id: CONF-CTL-021
  requirement: >
    member_amend refusals fire in this order, each shown to precede the next by an op
    faulty in both ways: cert_workspace_mismatch, cert_member_mismatch where the
    certificate names a device other than the envelope's author, bad_root_signature —
    verified under root authority at the op's own position, so a live delegate's
    signature passes — then 409 amend_id_already_used where a different op already used
    that amend id. An empty keys object, a member outside {control, content, kex}, and a
    key_id that is not the derivation of the pk beside it are malformed_control_payload
    above the whole sequence. A byte-identical repeat of an accepted amend answers
    duplicate=true and never amend_id_already_used.
  spec: "docs/03-authority.md §10, §12"
  subject: server
  observable: black-box
  codes: [cert_workspace_mismatch, cert_member_mismatch, bad_root_signature, amend_id_already_used, malformed_control_payload]
  test: tests/conformance/test_authority.py::test_amend_refusal_order

# ── Prune ops ────────────────────────────────────────────────────────────────

- id: CONF-PRUNE-001
  requirement: >
    Prune shape rules are refused at decode: empty targets, a duplicate by seq, a
    duplicate by (author, author_seq), and more than 1000 targets.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [prune_targets_empty, prune_duplicate_target, prune_targets_too_many, malformed_prune_payload]
  test: tests/conformance/test_prune.py::test_prune_shape_rules

- id: CONF-PRUNE-002
  requirement: >
    A prune naming a reprise that is neither staged in the same batch nor stored
    under the same author is refused prune_reprise_not_found.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [prune_reprise_not_found]
  test: tests/conformance/test_prune.py::test_a_reprise_must_exist

- id: CONF-PRUNE-003
  requirement: >
    On a prune, target cross-checks are refused per target in payload order: missing,
    control, prune, any other bit-7 class — extension classes included, since only a
    prune_ext reaches those — mismatched attestation, already reprised, and
    self-reference.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [prune_target_not_found, prune_target_is_control, prune_target_is_prune, prune_target_is_server_read, prune_target_attestation_mismatch, prune_target_already_reprised, prune_target_is_its_own_reprise]
  test: tests/conformance/test_prune.py::test_target_cross_checks

- id: CONF-PRUNE-004
  requirement: >
    A prune marks and never deletes: default pulls hide reprised ops and
    include_reprised=true serves them back byte-identically, at the member-GET bar.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_prune.py::test_a_prune_marks_and_never_deletes

- id: CONF-PRUNE-005
  requirement: Two concurrent prunes sharing a target yield prune_target_already_reprised for the loser, never a 500.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [prune_target_already_reprised]
  test: tests/conformance/test_prune.py::test_a_target_is_reprised_once

- id: CONF-PRUNE-006
  requirement: >
    The server hashes the whole envelope: a prune and a hard_prune whose target
    envelope_hash is SHA-256 over header || body || signature of the stored op,
    unframed and lowercase hex, are both accepted — while the same target attested
    with SHA-256 over the header alone, over the body alone, or over the unpacked
    payload is refused prune_target_attestation_mismatch.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [prune_target_attestation_mismatch]
  test: tests/conformance/test_prune.py::test_the_attestation_is_over_the_whole_envelope

- id: CONF-PRUNE-007
  requirement: >
    prune_ext shape rules are refused at decode, all malformed_prune_payload: a missing
    op_class or name, an op_class outside 192-255 or spelled as a hex string rather than
    a JSON integer, a name failing ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ or outside 1-32
    bytes, and any unrecognised key — a reprise among them, which a prune_ext never
    carries and never has resolved, so prune_reprise_not_found cannot arise on one. The
    three target shape rules bind identically:
    prune_targets_empty for no target, prune_duplicate_target for a duplicate by seq and
    for one by (author, author_seq), and prune_targets_too_many above 1000.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [malformed_prune_payload, prune_targets_empty, prune_duplicate_target, prune_targets_too_many]
  test: tests/conformance/test_prune.py::test_prune_ext_shape_rules

- id: CONF-PRUNE-008
  requirement: >
    On a prune_ext the per-target refusals fire in payload order and in this order, each
    shown to precede the next by a target faulty in both ways: prune_target_not_found,
    prune_target_is_control, prune_target_is_prune, prune_target_is_server_read,
    prune_ext_wrong_class carrying seq, prune_target_attestation_mismatch,
    prune_ext_name_mismatch carrying seq and expected, prune_target_already_reprised.
    Both seams hold: a 0xBF target answers prune_target_is_server_read and never
    prune_ext_wrong_class, and a target whose envelope_hash and whose name in force are
    both wrong answers prune_target_attestation_mismatch. prune_ext_wrong_class catches
    both directions — another extension class than the one named, and an opaque class —
    and prune_target_is_its_own_reprise never arises here.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [prune_target_not_found, prune_target_is_control, prune_target_is_prune, prune_target_is_server_read, prune_ext_wrong_class, prune_target_attestation_mismatch, prune_ext_name_mismatch, prune_target_already_reprised]
  test: tests/conformance/test_prune.py::test_prune_ext_target_order

- id: CONF-PRUNE-009
  requirement: >
    The name check is positional and per target, read from the target's author's binding
    interval at the target's own position. Against the log [1 ext_binding 0xCC bind
    "purge", 2 an 0xCC op, 3 ext_binding 0xCC unbind, 4 ext_binding 0xCC bind "copy",
    5 an 0xCC op]: prune_ext{op_class 204, name "purge", targets [2]} is accepted;
    prune_ext{op_class 204, name "copy", targets [2]} is refused prune_ext_name_mismatch
    carrying seq 2 and expected "purge"; and prune_ext{op_class 204, name "purge",
    targets [2, 5]} is refused at seq 5 with expected "copy". expected is the NAME in
    force there, never the one the server implements now.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [prune_ext_name_mismatch]
  test: tests/conformance/test_prune.py::test_prune_ext_name_is_positional

- id: CONF-PRUNE-010
  requirement: >
    The author of a prune_ext needs no binding of its own for the class it names, and
    the absence of one is never checked: a member holding the role and no ext_binding
    for that class, which never held one, folds another member's ops of it. It still
    folds them after the deployment has stopped implementing the class, when a fresh
    bind of that class answers ext_class_not_enabled — op_class is judged for range
    alone, never against the configuration.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [ext_class_not_enabled]
  test: tests/conformance/test_prune.py::test_prune_ext_needs_no_binding

- id: CONF-PRUNE-011
  requirement: >
    A role entry naming bare 0x81 confers prune and refuses a prune_ext 403
    role_forbids_prune_type, carrying prune_type "prune_ext" and the live roles sorted
    lexicographically; an entry naming prune_ext explicitly authors one. The verdict
    lands after the shape rules, not before them: a prune_ext with empty targets from
    that same bare-0x81 role answers prune_targets_empty, never role_forbids_prune_type.
  spec: "docs/01-the-log.md §7, docs/03-authority.md §7"
  subject: server
  observable: black-box
  codes: [role_forbids_prune_type, prune_targets_empty]
  test: tests/conformance/test_prune.py::test_a_bare_prune_class_confers_prune_alone

- id: CONF-PRUNE-012
  requirement: >
    An accepted prune_ext marks each target reprised in the one sense that state has:
    the target is hidden from the default read, served byte-identically under
    include_reprised=true, and recorded with the position of the op that marked it. A
    hard_prune then destroys its bytes, carrying no op_class and no name of its own. An
    extension-class op no prune_ext has marked is refused hard_prune_target_not_reprised,
    and a 0xBF op answers that same code for ever, since no type ever marks one.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [hard_prune_target_not_reprised]
  test: tests/conformance/test_prune.py::test_prune_ext_mark_composes_with_hard_prune

- id: CONF-PRUNE-013
  requirement: >
    A prune_ext op is itself an 0x81 op and so the target of nothing: naming one in a
    prune or in a prune_ext answers prune_target_is_prune, and naming one in a
    hard_prune answers hard_prune_target_is_prune — so its per-target envelope_hash
    outlives the ops it folded.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [prune_target_is_prune, hard_prune_target_is_prune]
  test: tests/conformance/test_prune.py::test_a_prune_is_the_target_of_nothing

- id: CONF-PRUNE-014
  requirement: >
    A client authoring a prune_ext takes name from the log — the target's author's
    binding interval at the target's position — and from nowhere else. Where its own
    live binding for that class, the extension_classes entry on GET /health, and the
    NAME in force at the target's position all differ, the payload it posts carries the
    value read from the log.
  spec: "docs/01-the-log.md §7"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_extensions.py::test_prune_ext_name_from_the_log

# ── Append effects ───────────────────────────────────────────────────────────

- id: CONF-EFFECT-001
  requirement: >
    A Grant is judged positionally: an op at a position between granted and revoked is
    authorised, and one outside is not, regardless of certificate clocks.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_prune.py::test_a_grant_is_judged_at_the_ops_position

- id: CONF-EFFECT-002
  requirement: A revocation position is write-once and a second revoke does not move it.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [already_revoked]
  test: tests/conformance/test_prune.py::test_a_revocation_position_is_write_once

- id: CONF-EFFECT-003
  requirement: >
    Losing the last live Grant revokes every refresh token scoped to that Member and
    closes its live signal sockets with 4403.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token]
  test: tests/conformance/test_prune.py::test_losing_the_last_grant_revokes_the_refresh_tokens

- id: CONF-EFFECT-004
  requirement: >
    A non-duplicate append pokes every subscriber after the commit; a pure-duplicate
    batch pokes nobody; a subscriber woken by a poke finds the ops already pullable.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_signal.py::test_poke_conditions

- id: CONF-EFFECT-005
  requirement: A materialised rotate creates the epoch with no wraps, and epoch-keys omits it until its wraps land.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_prune.py::test_a_rotate_creates_the_epoch_before_its_wraps

- id: CONF-EFFECT-006
  requirement: >
    An accepted member_amend naming control runs the revoke cascade without the grant
    half, at the commit: every refresh token scoped to that device is revoked and every
    live signal socket it holds in this Workspace closes with 4403, while its grants
    stay live. An amend naming only content, or only kex, does neither — the device's
    refresh token still refreshes and its socket stays open.
  spec: "docs/03-authority.md §10, §11"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token, "4403"]
  test: tests/conformance/test_effects.py::test_control_amend_cascade

# ── Signal socket ────────────────────────────────────────────────────────────

- id: CONF-SIG-001
  requirement: >
    The socket is accepted before authentication, and a successful handshake is
    acknowledged by an immediate empty text frame.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
