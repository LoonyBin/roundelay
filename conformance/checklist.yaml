  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [vault_fetch_rate_limited]
  test: tests/conformance/test_vault.py::test_fetch_rate_limit

- id: CONF-ESC-007
  requirement: Every served vault read is durably recorded before the bytes leave.
  spec: "docs/04-keys.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_vault.py::test_read_audited

- id: CONF-ESC-008
  requirement: Two concurrent vault writes resolve with exactly one winner and a version verdict for the loser.
