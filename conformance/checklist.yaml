  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_signal.py::test_the_socket_says_only_look_again

- id: CONF-SIG-006
  requirement: N appends before a subscriber wakes deliver one poke, not N.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_signal.py::test_the_socket_says_only_look_again

- id: CONF-SIG-007
  requirement: Access-token expiry does not close a live socket.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_signal.py::test_an_expiring_access_token_does_not_close_a_live_socket

- id: CONF-SIG-008
  requirement: >
    A device holding no registration opens WS /signal on a Workspace with no genesis:
