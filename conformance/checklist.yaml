# ── Key plane ────────────────────────────────────────────────────────────────

- id: CONF-KEY-001
  requirement: A wrap set for epoch > 0 with no materialised rotate answers 409 rotate_not_materialised.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [rotate_not_materialised]
  test: tests/conformance/test_keyplane.py::test_an_unmaterialised_epoch_has_no_wraps

- id: CONF-KEY-002
  requirement: >
    A wrap set that does not hash to the committed digest answers 422
    keywrap_digest_mismatch with expected_digest.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch]
  test: tests/conformance/test_keyplane.py::test_a_set_must_hash_to_the_committed_digest

- id: CONF-KEY-003
  requirement: >
    Epoch 0 requires keywrap_digest when no record exists (missing_keywrap_digest
    otherwise) and ignores it once one does, so a byte-identical replay without it
    answers 200.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [missing_keywrap_digest, malformed_keywrap_digest]
  test: tests/conformance/test_keyplane.py::test_epoch_zero_needs_a_digest_until_it_has_one

- id: CONF-KEY-004
  requirement: A byte-identical re-upload answers 200; a different set for a written epoch is refused.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch, keywrap_already_written]
  test: tests/conformance/test_keyplane.py::test_a_written_epoch_takes_the_same_set_only

- id: CONF-KEY-005
  requirement: >
    Per-entry validation is refused with index: malformed wrap, malformed kex_key_id, an
    unknown member, an unregistered kex_key_id, and a duplicate member.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [malformed_keywrap, malformed_kex_key_id, unknown_keywrap_member, kex_key_id_not_registered, duplicate_keywrap_member]
  test: tests/conformance/test_keyplane.py::test_per_entry_validation_names_the_entry

- id: CONF-KEY-006
  requirement: >
    PUT …/keywraps refuses its two top-level fields at their documented positions:
    malformed_key_epoch after no_registration and before no_live_grant, so a caller
    with no live grant and an out-of-range epoch answers malformed_key_epoch; and
    malformed_escrow_wrap after keywrap_requires_owner and before any per-entry check,
    so a non-authority caller with a malformed escrow wrap answers
    keywrap_requires_owner.
  spec: "docs/04-keys.md §8"
  subject: server
  observable: black-box
  codes: [malformed_escrow_wrap, malformed_key_epoch, no_live_grant, keywrap_requires_owner]
  test: tests/conformance/test_keyplane.py::test_the_byte_fields_keep_their_own_codes_at_the_decoder

- id: CONF-KEY-007
  requirement: A non-authority member uploading wraps is refused 403 keywrap_requires_owner with revoked.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_requires_owner]
  test: tests/conformance/test_keyplane.py::test_publishing_is_an_authoritys_act

- id: CONF-KEY-008
  requirement: >
    GET keywraps/me returns only the calling Member's wraps, every epoch, ordered by
    epoch ascending.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_my_wraps_are_mine_alone

- id: CONF-KEY-009
  requirement: >
    GET epoch-keys requires any live Grant, is ordered by epoch ascending, and omits
    epochs whose escrow wrap has not been uploaded.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_keyplane.py::test_epoch_keys_needs_a_live_grant

- id: CONF-KEY-010
  requirement: Two concurrent uploads of one epoch resolve idempotently or with a documented refusal, never a 500.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch, keywrap_already_written]
  test: tests/conformance/test_races.py::test_concurrent_wrap_uploads

- id: CONF-KEY-011
  requirement: >
    A client admitting a member to a keyed Workspace rotates rather than registering
    alone. A device registered after epoch N's set was published receives its first
    wrap in epoch N+1's set, holds none for any epoch ≤ N, and its GET keywraps/me
    returns nothing until that rotation lands.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_a_device_admitted_after_an_epoch_holds_none_of_it

- id: CONF-KEY-012
  requirement: >
    GET keywraps/me pages the epoch ordering: after_epoch is exclusive, has_more is
    exact, limit defaults to limits.default_page_size, and an absent after_epoch starts
    at the first epoch held while after_epoch=0 starts above epoch 0.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_my_wraps_pages_by_epoch

- id: CONF-KEY-013
  requirement: >
    On GET keywraps/me, a limit outside 1..max_page_size and an after_epoch outside
