  subject: server
  observable: black-box
  codes: [workspace_quota_exhausted]
  test: tests/conformance/test_quota.py::test_the_exemption_does_not_survive_batching

- id: CONF-QUOTA-005
  requirement: >
    A per-member bound refuses member_quota_exhausted, distinct from
    workspace_quota_exhausted, and other members of the same Workspace still write.
