# ── Hard prune ───────────────────────────────────────────────────────────────

- id: CONF-HARD-001
  requirement: >
    A 0x81 payload with no type, or an unrecognised type, is refused
    malformed_prune_payload and unsupported_prune_type respectively; all three v1
    types — prune, prune_ext and hard_prune — are accepted.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [malformed_prune_payload, unsupported_prune_type]
  test: tests/conformance/test_prune.py::test_the_prune_type_selects_the_rules

- id: CONF-HARD-002
  requirement: >
    A hard_prune naming an op no landed prune has marked reprised is refused
    hard_prune_target_not_reprised, and the op's bytes still serve under
    include_reprised=true.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [hard_prune_target_not_reprised]
  test: tests/conformance/test_prune.py::test_only_what_a_prune_marked_may_be_destroyed

- id: CONF-HARD-003
  requirement: >
    A hard_prune naming a 0x81 op is refused hard_prune_target_is_prune even though
    that target is necessarily not marked reprised — rule 3 runs before rule 4, which
    is the only reason the code is reachable — so the hashes that let a verifier chain
    past an existing hole always survive. Rule 3 excludes 0x81 targets and not
    extension-class ones: an op in 0xC0-0xFF that a landed prune_ext marked reprised
    passes rule 3 and is destroyed, while 0x80 and 0xBF stay unreachable through rule 4
    for ever, since no type ever marks one.
  spec: "docs/01-the-log.md §7"
  subject: server
  observable: black-box
  codes: [hard_prune_target_is_prune]
  test: tests/conformance/test_prune.py::test_prune_ops_are_never_targets

- id: CONF-HARD-004
  requirement: >
    After an accepted hard_prune the target is absent from include_reprised=true, its
    seq does not shift, every later since-cursor still resolves, and re-appending the
    destroyed op is still refused by (workspace, author, op_id) uniqueness.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_prune.py::test_a_hard_prune_leaves_the_shape_of_the_log

- id: CONF-HARD-005
  requirement: >
    A hard_prune target is attestation-checked on both paths: with the bytes still
    held, a wrong envelope_hash is refused prune_target_attestation_mismatch; with the
    bytes already gone, the tombstone's retained hash is compared instead, so a wrong
    envelope_hash is refused prune_target_attestation_mismatch there too and a right
    one applies nothing and is not an error.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [prune_target_attestation_mismatch]
  test: tests/conformance/test_prune.py::test_a_hard_prune_is_attested_on_both_paths

- id: CONF-HARD-008
  requirement: >
    A hard_prune naming a seq no op was ever stored at is refused
    prune_target_not_found, and a hard_prune naming a seq whose bytes a prior
    hard_prune destroyed is not: the tombstone is found and judged, never reported
    missing.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [prune_target_not_found]
  test: tests/conformance/test_prune.py::test_a_hard_prune_is_attested_on_both_paths

- id: CONF-HARD-006
  requirement: >
    A role entry naming 0x81 without payload types authors prune and is refused
    role_forbids_prune_type on hard_prune, carrying prune_type and the live roles
    sorted lexicographically; an entry naming hard_prune explicitly authors both. The
    verdict lands after the shape rules, not before them: a hard_prune with empty
    targets from that same bare-0x81 role answers prune_targets_empty, never
    role_forbids_prune_type.
  spec: "docs/01-the-log.md §7, docs/03-authority.md §9"
  subject: server
  observable: black-box
  codes: [role_forbids_prune_type, prune_targets_empty]
  test: tests/conformance/test_prune.py::test_a_bare_prune_class_confers_prune_alone

- id: CONF-HARD-007
  requirement: >
    The server initiates no deletion of its own: with no hard_prune in the log, every
    reprised op still serves under include_reprised=true regardless of age.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_prune.py::test_only_what_a_prune_marked_may_be_destroyed

# ── Consumption ──────────────────────────────────────────────────────────────

- id: CONF-QUOTA-001
