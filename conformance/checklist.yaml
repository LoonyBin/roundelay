  test: tests/conformance/test_keyplane.py::test_paging_parameters_are_never_clamped

- id: CONF-KEY-014
  requirement: >
    GET epoch-keys pages the epoch ordering with after_epoch exclusive and has_more
    exact, and an epoch whose escrow wrap is not uploaded is absent from every page:
    with epoch 8 omitted, a page ending at 7 answers has_more true and the next page
    begins at 9.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_epoch_keys_omits_an_epoch_with_no_escrow_wrap

- id: CONF-KEY-015
  requirement: >
    On GET epoch-keys, a limit outside 1..max_page_size and an after_epoch outside
    0..2^32-1 are refused 422 malformed_request, never clamped or coerced; any other
    query parameter is refused 422 unknown_request_field.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [malformed_request, unknown_request_field]
  test: tests/conformance/test_keyplane.py::test_paging_parameters_are_never_clamped

