  subject: server
  observable: black-box
  codes: [vault_version_regression]
  test: tests/conformance/test_races.py::test_concurrent_vault_writes

- id: CONF-ESC-009
  requirement: >
    A write declaring a different root_pk moves the pin when it is signed by the
