  subject: server
  observable: black-box
  codes: [member_quota_exhausted]
  test: tests/conformance/test_quota.py::test_a_member_bound_is_a_different_code

- id: CONF-QUOTA-006
  requirement: >
    The 0x81 exemption is stated on the class, so it covers every payload type: with
    writes refused workspace_quota_exhausted, a batch containing only prune_ext ops is
