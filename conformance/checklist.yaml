# Roundelay conformance checklist.
#
# Authoritative. The five layer documents defer to this file.
#
# Two lints hold, and a conforming release runs both:
#   coverage      — every code in docs/reference/refusal-codes.md appears in some item's `codes`
#   observability — every `observable: black-box` item is decidable from HTTP/WS traffic alone
#
# Fields:
#   id          stable; cite it in review ("this loosens CONF-LOG-014")
#   requirement one sentence, mechanically decidable
#   spec        the section it derives from
#   subject     server | client | profile
#   observable  black-box | white-box
#   codes       refusal codes exercised, signal close codes included; [] where none
#   test        binding into the implementation's suite

version: 1
spec: docs/README.md

items:

# ── Contract versioning ──────────────────────────────────────────────────────

- id: CONF-VER-001
  requirement: >
    Every functional route the five layers define is served under /v1; only
    /health and /health/db sit outside the prefix.
  spec: "docs/05-compatibility.md §3"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_versioning.py::test_prefix_placement

- id: CONF-VER-002
  requirement: >
    GET /v2/w/{w}/ops answers 404 unsupported_contract_version with requested="v2"
    and served=["v1"].
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unsupported_contract_version]
  test: tests/conformance/test_versioning.py::test_unserved_version

- id: CONF-VER-003
  requirement: >
    A non-version-shaped first segment (/api/…, /V2/…, /v01/…, /v1x/…) and a served
    version with an unknown suffix (/v1/nope) both answer 404 not_found.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [not_found]
  test: tests/conformance/test_versioning.py::test_not_version_shaped

- id: CONF-VER-004
  requirement: >
    An unknown body field at any depth is refused 422 unknown_request_field, with all
    offending dot-paths listed and sorted lexicographically by UTF-8 bytes.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field]
  test: tests/conformance/test_versioning.py::test_unknown_body_field

- id: CONF-VER-005
  requirement: An unknown query parameter is refused 422 unknown_request_field.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field]
  test: tests/conformance/test_versioning.py::test_unknown_query_parameter

- id: CONF-VER-006
  requirement: >
    The unknown-field check runs after credential resolution and before authorization:
    an unauthenticated request with an unknown field answers 401, and an authenticated
    but unauthorized one answers 422.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field, invalid_credential]
  test: tests/conformance/test_versioning.py::test_check_order

- id: CONF-VER-007
  requirement: A duplicate JSON object key is refused 422 malformed_request, never resolved last-wins.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_request]
  test: tests/conformance/test_versioning.py::test_duplicate_key

- id: CONF-VER-008
  requirement: >
    Wrong JSON scalar types are refused: a boolean, float or string where the
    conventions require an integer, and an integer outside the field's documented
    range.
  spec: "docs/README.md §6"
  subject: server
  observable: black-box
  codes: [malformed_request]
  test: tests/conformance/test_versioning.py::test_wrong_scalar_types

- id: CONF-VER-009
  requirement: >
    No functional route is added to a contract version already served: the served route
    table under /v1 is exactly the functional routes the five layers define, with
    /health and /health/db outside the prefix and no route beyond that set reachable
    there. A route the deployment adds later is served under a new contract version,
    which contract_versions then lists beside the old one.
  spec: "docs/05-compatibility.md §3"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_versioning.py::test_no_routes_added_to_served_version

# ── Health ───────────────────────────────────────────────────────────────────

- id: CONF-HEALTH-001
  requirement: >
    GET /health returns status, a non-empty version, contract_versions ascending,
    protocol_namespace, profile, extension_classes, served_sets and the four required
    limits keys. extension_classes is always present — {} where none are enabled, never
    absent — and its keys are decimal JSON strings with no leading zeros. served_sets is
    always present and carries all four of suites, op_classes, control_types and
    prune_types: suites and op_classes are JSON integers in decimal and ascending,
    control_types and prune_types are strings sorted lexicographically, and no set is
    spelled the other way round.
  spec: "docs/05-compatibility.md §7"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_health.py::test_health_document

- id: CONF-HEALTH-002
  requirement: GET /health succeeds while the backing store is unavailable.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_health.py::test_health_survives_store_outage

- id: CONF-HEALTH-003
  requirement: GET /health/db answers 503 store_unavailable when the store is unreachable.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [store_unavailable]
  test: tests/conformance/test_health.py::test_health_db_outage

- id: CONF-HEALTH-004
  requirement: >
    extension_classes reports exactly what ext_binding accepts: a bind naming a
    class and NAME the field lists is accepted, one naming a class absent from the
    field is refused ext_class_not_enabled, and one naming a listed class under any
    other name is refused ext_name_mismatch carrying that field's value as expected.
    Where the field is {}, every well-formed bind is refused ext_class_not_enabled.
  spec: "docs/05-compatibility.md §7"
  subject: server
  observable: black-box
  codes: [ext_class_not_enabled, ext_name_mismatch]
  test: tests/conformance/test_health.py::test_extension_classes_matches_binding

- id: CONF-HEALTH-005
  requirement: >
    Mid-outage a functional route answers 503 store_unavailable carrying no other
    detail field, while GET /health still answers 200.
  spec: "docs/05-compatibility.md §7"
  subject: server
  observable: black-box
  codes: [store_unavailable]
  test: tests/conformance/test_health.py::test_outage_on_functional_route

- id: CONF-HEALTH-006
  requirement: >
    served_sets is truthful in both directions, tested against the four fail-closed
    codes: every suite it lists is accepted on some op and a suite byte it omits is
    refused unsupported_suite; every class it lists is accepted and a class byte it
    omits is refused unsupported_op_class; every control type it lists is served and one
    it omits is refused unsupported_control_type; every prune type it lists is served
    and one it omits is refused unsupported_prune_type.
  spec: "docs/05-compatibility.md §7"
  subject: server
  observable: black-box
  codes: [unsupported_suite, unsupported_op_class, unsupported_control_type, unsupported_prune_type]
  test: tests/conformance/test_health.py::test_served_sets_are_truthful

- id: CONF-HEALTH-007
  requirement: >
    served_sets.op_classes is every class byte the server accepts, across all three
    ranges: every key of extension_classes appears in it as the same value spelled as an
    integer — the key "197" against the element 197 — and so does every opaque class the
    profile declares in 0x40-0x7F, which carries no NAME and appears in no
    extension_classes entry. The two fields never disagree about a class either names.
  spec: "docs/05-compatibility.md §5, §7"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_health.py::test_op_classes_covers_every_range

# ── Wire format ──────────────────────────────────────────────────────────────

- id: CONF-WIRE-001
  requirement: >
    An envelope posted and then pulled is returned byte-identically, including one
    whose 0x01 body is uniformly random (illegal framing, payload_len overrunning,
    non-zero padding).
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_oplog.py::test_ops_are_served_back_byte_identically

- id: CONF-WIRE-002
  requirement: >
    Header offsets are honoured: byte 0 = 0x03 gives unsupported_op_class; byte 1 = 0x02
    gives unsupported_suite; bytes 2-17 not matching the path Workspace gives
    workspace_mismatch; bytes 38-53 not matching the token's Member gives
    author_member_mismatch.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_suite, unsupported_op_class, workspace_mismatch, author_member_mismatch]
  test: tests/conformance/test_oplog.py::test_header_offsets_are_honoured

- id: CONF-WIRE-003
  requirement: >
    An envelope shorter than 158 bytes gives truncated_envelope; one at or above 158
    but below the suite's floor gives envelope_too_short, and the floor is 16 bytes
    higher under suite 0x01.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [truncated_envelope, envelope_too_short]
  test: tests/conformance/test_oplog.py::test_length_floors

- id: CONF-WIRE-004
  requirement: >
    A served suite on a class that forbids it is the encrypted_* family, never
    unsupported_suite: suite 0x01 gives encrypted_control_op on 0x80,
    encrypted_prune_op on 0x81, and encrypted_server_read_op on 0xBF or on an enabled
    extension class — while a suite byte this server does not serve gives
    unsupported_suite on those same classes.
  spec: "docs/04-keys.md, docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [encrypted_control_op, encrypted_prune_op, encrypted_server_read_op, unsupported_suite]
  test: tests/conformance/test_oplog.py::test_sealed_server_read_classes

- id: CONF-WIRE-005
  requirement: >
    Op classes 0x03 and 0x04 are refused unsupported_op_class, as is every unassigned,
    undeclared or unenabled value in all four quadrants; 0x01, 0x02, 0x80, 0x81 and
    0xBF are served. Under a profile enabling no extension class a well-formed
    ext_binding is therefore refused ext_class_not_enabled for the class it names,
    never unsupported_op_class for its own 0xBF.
  spec: "docs/01-the-log.md §3"
  subject: server
  observable: black-box
  codes: [unsupported_op_class, ext_class_not_enabled]
  test: tests/conformance/test_oplog.py::test_unassigned_classes

- id: CONF-WIRE-006
  requirement: A base64 value with a non-alphabet character or missing padding is refused, never repaired.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_request, malformed_sign_pk, malformed_base64]
  test: tests/conformance/test_oplog.py::test_base64_is_never_repaired

- id: CONF-WIRE-007
  requirement: >
    Uppercase hex and non-canonical UUID spellings (braces, urn: prefix, uppercase,
    missing dashes) are refused inside control and prune payloads, never normalised.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_control_payload, malformed_prune_payload]
  test: tests/conformance/test_oplog.py::test_non_canonical_uuid_spellings

- id: CONF-WIRE-008
  requirement: >
    Signature preimages are length-prefixed: framed(domain, rest) = u8 len(domain) ||
    domain || rest, asserted against frozen vectors for all fifteen fixed core
    domains. Those fifteen are the whole of the core set: an envelope of any class
    below 0xC0 frames under <ns>/op/v1, while an extension-class op frames under
    <ns>/ext/<name>/v1 instead and is vectored per profile by CONF-WIRE-022.
  spec: "docs/04-keys.md §2"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_vectors.py::test_domains_match_the_corpus

- id: CONF-WIRE-009
  requirement: >
    keywrap_digest sorts by raw member_id bytes then raw kex_key_id bytes; a set whose
    base64 order differs from its byte order produces the byte-order digest.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch]
  test: tests/conformance/test_keyplane.py::test_the_digest_the_server_computes_sorts_by_raw_bytes

- id: CONF-WIRE-010
  requirement: HKDF uses a 32-zero-byte salt, HMAC-SHA-256, L=32, asserted against frozen wrap vectors.
  spec: "docs/04-keys.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_vectors.py::test_escrow_wrap_matches_the_corpus

- id: CONF-WIRE-011
  requirement: >
    A profile-defined opaque class in 0x40-0x7F that the profile declares is handled
    exactly as 0x01: stored and served byte-identically, never parsed, admitted only
    by a role that names it, and eligible as a prune target. One the profile has not
    declared is refused unsupported_op_class.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_op_class, role_forbids_op_class]
  test: tests/conformance/test_extensions.py::test_a_declared_opaque_class_behaves_exactly_like_content

- id: CONF-WIRE-012
  requirement: >
    The extension range is disabled by default: on a server implementing none, an op
    in 0xC0-0xFF is refused unsupported_op_class, and the whole suite still passes
    with such ops present in the log from an earlier deployment.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_op_class]
  test: tests/conformance/test_oplog.py::test_the_extension_range_is_disabled_by_default

- id: CONF-WIRE-013
  requirement: >
    An extension class is bound only from the position of its author's own ext_binding:
    an op of that class at any earlier position is refused ext_class_not_active, a batch
    of [ext_binding, ext op] is accepted, and [ext op, ext_binding] is refused at index
    0. An op after the binding's write-once end position is likewise refused.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_active]
  test: tests/conformance/test_extensions.py::test_a_binding_binds_from_its_own_position

- id: CONF-WIRE-014
  requirement: >
    An ext_binding naming a class this server implements, but under a different NAME, is
    refused ext_name_mismatch carrying the expected name, and no binding is recorded.
    Replaying a log written against another implementation's 0xC0 therefore fails at its
    first ext_binding rather than processing those ops under the wrong meaning.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_name_mismatch]
  test: tests/conformance/test_extensions.py::test_a_wrong_name_records_no_binding

- id: CONF-WIRE-015
  requirement: >
    Bindings are member-scoped and are the binding of record. Member B's binding for a
    class does not bind member A: A's op of that class is refused ext_class_not_active
    while A holds no binding of its own, never judged against B's. And after the server's
    implementation of that class is reconfigured to a different NAME, a further op from a
    member whose recorded binding names the old one is refused ext_name_mismatch rather
    than reinterpreted.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_active, ext_name_mismatch]
  test: tests/conformance/test_extensions.py::test_bindings_are_member_scoped

- id: CONF-WIRE-016
  requirement: >
    A client refuses to author an op of an extension class for which it holds no live
    binding of its own carrying the name it believes, and does not infer one from another
    member's binding.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_extensions.py::test_no_authoring_without_own_binding

- id: CONF-WIRE-017
  requirement: >
    ext_binding shape rules are refused at decode: an unrecognised key, a missing type,
    op_class or (on bind) name, a name present on an unbind, an op_class outside
    192-255, and a name failing the token pattern or length. An unknown type is
    unsupported_ext_binding_type carrying type.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [malformed_ext_binding_payload, unsupported_ext_binding_type]
  test: tests/conformance/test_extensions.py::test_ext_binding_shape_rules

- id: CONF-WIRE-018
  requirement: >
    bind is refused per cause in order: ext_class_not_enabled for a class the deployment
    does not permit, ext_name_mismatch for one it implements under another name, and 409
    ext_class_already_bound when this member already holds a live binding for it.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_enabled, ext_name_mismatch, ext_class_already_bound]
  test: tests/conformance/test_extensions.py::test_bind_refusals_in_order

- id: CONF-WIRE-019
  requirement: >
    unbind is looked up under (Workspace, author, op_class): with no live binding it is
    ext_class_not_bound, and another member's live binding is likewise not found. After
    an unbind the member may bind the class again, under the same name or a different
    one, and ops are judged against the interval their position falls in.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_bound, ext_class_not_active]
  test: tests/conformance/test_extensions.py::test_unbind_closes_the_interval_and_another_may_open

- id: CONF-WIRE-020
  requirement: >
    Suite 0x01 with op_class 0xBF, or with any other server-read class that is not 0x80
    or 0x81, gives encrypted_server_read_op.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [encrypted_server_read_op]
  test: tests/conformance/test_extensions.py::test_sealing_a_served_server_read_class_that_is_not_control_or_prune

- id: CONF-WIRE-021
  requirement: >
    A request body exceeding the deployment's documented bound answers 413
    request_too_large, on any route.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [request_too_large]
  test: tests/conformance/test_extensions.py::test_a_body_beyond_the_bound

- id: CONF-WIRE-022
  requirement: >
    The profile holds one frozen preimage vector per enabled extension NAME, framing
    that class's envelopes under <ns>/ext/<name>/v1. Enabling any number of extensions
    leaves the fifteen fixed core vectors byte-identical, and two enabled names never
    share a domain.
  spec: "docs/04-keys.md §2"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_extensions.py::test_enabling_extensions_leaves_the_core_domains_alone

- id: CONF-WIRE-023
  requirement: >
    Both selector bytes resolve before the floor. An envelope at least 158 bytes long
    whose suite byte this server does not serve, and whose total length is below every
    served suite's floor, answers unsupported_suite and never envelope_too_short; one
    whose class byte is unserved under the same two conditions answers
    unsupported_op_class and never envelope_too_short. An envelope under 158 bytes still
    answers truncated_envelope whichever selector bytes it would have carried.
  spec: "docs/01-the-log.md §6"
  subject: server
  observable: black-box
  codes: [unsupported_suite, unsupported_op_class, envelope_too_short, truncated_envelope]
  test: tests/conformance/test_oplog.py::test_selector_bytes_resolve_before_the_floor

# ── Credentials ──────────────────────────────────────────────────────────────

- id: CONF-CRED-001
  requirement: >
    A refresh token presented as a bearer access token on a device route answers 401
    invalid_credential; the two flavours are not interchangeable.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_credential]
  test: tests/conformance/test_identity.py::test_a_refresh_token_is_not_a_bearer_token

- id: CONF-CRED-002
  requirement: >
    An access token presented to the refresh route, and a refresh token scoped to a
    different device, each answer 401 invalid_refresh_token.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token]
  test: tests/conformance/test_identity.py::test_an_access_token_is_not_a_refresh_token

- id: CONF-CRED-003
  requirement: "A refresh token rotates: the presented token is revoked and a fresh pair issued."
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token]
  test: tests/conformance/test_identity.py::test_a_refresh_rotates_the_pair

- id: CONF-CRED-004
  requirement: A live refresh token cannot be reconstructed from server storage.
  spec: "docs/02-identity.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_credentials.py::test_refresh_stored_irreversibly

- id: CONF-CRED-005
  requirement: "Every 401 response carries WWW-Authenticate: Bearer."
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [invalid_credential, invalid_refresh_token, bad_member_challenge]
  test: tests/conformance/test_identity.py::test_every_401_offers_the_scheme

- id: CONF-CRED-006
  requirement: >
    On the founding branch, POST /v1/members is gated by the Root-signed certificate in
    its body alone: a workspace_genesis certificate whose root_pk may not create the
    Workspace id it names answers 403 workspace_not_reachable, and one Root did not
    sign answers 422 bad_root_signature — both before any Workspace of that id exists.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [workspace_not_reachable, bad_root_signature]
  test: tests/conformance/test_identity.py::test_the_founding_branch_is_gated_by_its_certificate

- id: CONF-CRED-007
  requirement: >
    A member challenge is consumed by the attempt whether or not the signature
    verifies, and a second use of the same nonce answers bad_member_challenge.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [bad_member_challenge]
  test: tests/conformance/test_identity.py::test_a_challenge_is_spent_by_the_attempt

- id: CONF-CRED-008
  requirement: >
    POST /v1/members/{m}/challenge for an unregistered id answers 404 unknown_member
    and creates no rate counter, so a subsequent registration is not pre-limited.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [unknown_member, member_challenge_rate_limited]
  test: tests/conformance/test_identity.py::test_a_challenge_for_an_unknown_member

# ── Authorization ────────────────────────────────────────────────────────────

- id: CONF-AUTHZ-001
  requirement: >
    Exhaustive route x principal matrix: every route at either bar, and the three
    outside them, against no credential, a refresh token presented as a bearer access
    token, a device token with zero Grants, a device token per role, and a device
    token with all Grants revoked, each yielding the documented status.
  spec: "docs/03-authority.md §8"
  subject: server
  observable: black-box
  codes: [invalid_credential, no_registration, no_live_grant, role_forbids_op_class, keywrap_requires_owner]
  test: tests/conformance/test_authz_matrix.py::test_full_matrix

- id: CONF-AUTHZ-002
  requirement: >
    In a Workspace with an accepted genesis, a device with no accepted registration
    answers 403 no_registration on every Workspace-scoped device route, before any
    other check.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_registration]
  test: tests/conformance/test_authority.py::test_unregistered_device_is_refused

- id: CONF-AUTHZ-013
  requirement: >
    The access gate is per Workspace: a device registered in W1 and not W2 is served
    W1 and answers 403 no_registration for W2, though one Root founded both.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_registration]
  test: tests/conformance/test_authority.py::test_the_gate_is_per_workspace

- id: CONF-AUTHZ-014
  requirement: >
    The exemption reaches the author's first op and no further: a member_register
    naming the author, and a workspace_genesis, are both accepted from a device
    holding no registration there — while the same device posting
    [content, member_register naming the author] answers 403 no_registration, because
    the batch's first op is not the one that establishes access.
  spec: "docs/03-authority.md §3.2"
  subject: server
  observable: black-box
  codes: [no_registration]
  test: tests/conformance/test_authority.py::test_the_exemption_reaches_the_first_op_only

- id: CONF-AUTHZ-015
