    bad_root_signature.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [cert_root_pk_mismatch, bad_root_signature]
  test: tests/conformance/test_authority.py::test_handover_names_the_current_root

- id: CONF-HAND-002
  requirement: >
    After a handover lands, certificates signed by the incoming Root are accepted and a
    second handover from the retired key answers 422 cert_root_pk_mismatch.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [cert_root_pk_mismatch]
  test: tests/conformance/test_authority.py::test_after_a_handover_the_incoming_root_signs

- id: CONF-HAND-003
  requirement: >
    A handover changes nothing already recorded: every registration stays registered,
