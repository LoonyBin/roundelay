# Roundelay conformance checklist.
#
# Authoritative. The five layer documents defer to this file.
#
# Two lints hold, and a conforming release runs both:
#   coverage      — every code in docs/reference/refusal-codes.md appears in some item's `codes`
#   observability — every `observable: black-box` item is decidable from HTTP/WS traffic alone
#
# Fields:
#   id          stable; cite it in review ("this loosens CONF-LOG-014")
#   requirement one sentence, mechanically decidable
#   spec        the section it derives from
#   subject     server | client | profile
#   observable  black-box | white-box
#   codes       refusal codes exercised, signal close codes included; [] where none
#   test        binding into the implementation's suite

version: 1
spec: docs/README.md

items:

# ── Contract versioning ──────────────────────────────────────────────────────

- id: CONF-VER-001
  requirement: Every route in §6 and §7 is served under /v1; /health and /health/db are not.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_versioning.py::test_prefix_placement

- id: CONF-VER-002
  requirement: >
    GET /v2/w/{w}/ops answers 404 unsupported_contract_version with requested="v2"
    and served=["v1"].
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unsupported_contract_version]
  test: tests/conformance/test_versioning.py::test_unserved_version

- id: CONF-VER-003
  requirement: >
    A non-version-shaped first segment (/api/…, /V2/…, /v01/…, /v1x/…) and a served
    version with an unknown suffix (/v1/nope) both answer 404 not_found.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [not_found]
  test: tests/conformance/test_versioning.py::test_not_version_shaped

- id: CONF-VER-004
  requirement: >
    An unknown body field at any depth is refused 422 unknown_request_field, with all
    offending dot-paths listed and sorted lexicographically by UTF-8 bytes.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field]
  test: tests/conformance/test_versioning.py::test_unknown_body_field

- id: CONF-VER-005
  requirement: An unknown query parameter is refused 422 unknown_request_field.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field]
  test: tests/conformance/test_versioning.py::test_unknown_query_param

- id: CONF-VER-006
  requirement: >
    The unknown-field check runs after credential resolution and before authorization:
    an unauthenticated request with an unknown field answers 401, and an authenticated
    but unauthorized one answers 422.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [unknown_request_field, invalid_credential]
  test: tests/conformance/test_versioning.py::test_unknown_field_ordering

- id: CONF-VER-007
  requirement: A duplicate JSON object key is refused 422 malformed_request, never resolved last-wins.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_request]
  test: tests/conformance/test_versioning.py::test_duplicate_json_key

- id: CONF-VER-008
  requirement: >
    Wrong JSON scalar types are refused: a boolean or float where §2.4 requires an
    integer, and an out-of-range integer.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_request]
  test: tests/conformance/test_scalars.py::test_scalar_types

# ── Health ───────────────────────────────────────────────────────────────────

- id: CONF-HEALTH-001
  requirement: >
    GET /health returns status, a non-empty version, contract_versions ascending,
    protocol_namespace, profile, and the four required limits keys.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_health.py::test_health_shape

- id: CONF-HEALTH-002
  requirement: GET /health succeeds while the backing store is unavailable.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_health.py::test_health_survives_store_outage

- id: CONF-HEALTH-003
  requirement: GET /health/db answers 503 store_unavailable when the store is unreachable.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: [store_unavailable]
  test: tests/conformance/test_health.py::test_health_db_outage

# ── Wire format ──────────────────────────────────────────────────────────────

- id: CONF-WIRE-001
  requirement: >
    An envelope posted and then pulled is returned byte-identically, including one
    whose 0x01 body is uniformly random (illegal framing, payload_len overrunning,
    non-zero padding).
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_wire.py::test_envelope_roundtrip_opaque

- id: CONF-WIRE-002
  requirement: >
    Header offsets are honoured: byte 0 = 0x03 gives unsupported_op_class; byte 1 = 0x02
    gives unsupported_suite; bytes 2-17 not matching the path Workspace gives
    workspace_mismatch; bytes 38-53 not matching the token's Member gives
    author_member_mismatch.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_suite, unsupported_op_class, workspace_mismatch, author_member_mismatch]
  test: tests/conformance/test_wire.py::test_header_offsets_by_probe

- id: CONF-WIRE-003
  requirement: >
    An envelope shorter than 158 bytes gives truncated_envelope; one at or above 158
    but below the suite's floor gives envelope_too_short, and the floor is 16 bytes
    higher under suite 0x01.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [truncated_envelope, envelope_too_short]
  test: tests/conformance/test_wire.py::test_length_floors

- id: CONF-WIRE-004
  requirement: Suite 0x01 with op_class 0x80 gives encrypted_control_op; with op_class 0x81, encrypted_prune_op.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [encrypted_control_op, encrypted_prune_op]
  test: tests/conformance/test_wire.py::test_forbidden_pairs

- id: CONF-WIRE-005
  requirement: >
    Op class 0x03 is refused unsupported_op_class, as is every unassigned, undeclared
    or unenabled value in all four quadrants; 0x01, 0x04, 0x80, 0x81 are served.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_op_class]
  test: tests/conformance/test_wire.py::test_served_op_classes

- id: CONF-WIRE-006
  requirement: A base64 value with a non-alphabet character or missing padding is refused, never repaired.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_request, malformed_sign_pk]
  test: tests/conformance/test_wire.py::test_strict_base64

- id: CONF-WIRE-007
  requirement: >
    Uppercase hex and non-canonical UUID spellings (braces, urn: prefix, uppercase,
    missing dashes) are refused inside control and prune payloads, never normalised.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [malformed_control_payload, malformed_prune_payload]
  test: tests/conformance/test_wire.py::test_canonical_spellings

- id: CONF-WIRE-008
  requirement: >
    Signature preimages are length-prefixed: framed(domain, rest) = u8 len(domain) ||
    domain || rest, asserted against frozen vectors for all ten domains.
  spec: "docs/04-keys.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_domains.py::test_framed_preimages

- id: CONF-WIRE-009
  requirement: >
    keywrap_digest sorts by raw member_id bytes then raw kex_key_id bytes; a set whose
    base64 order differs from its byte order produces the byte-order digest.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch]
  test: tests/conformance/test_keyplane.py::test_digest_sort_key

- id: CONF-WIRE-010
  requirement: HKDF uses a 32-zero-byte salt, HMAC-SHA-256, L=32, asserted against frozen wrap vectors.
  spec: "docs/04-keys.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_hkdf_salt

- id: CONF-WIRE-011
  requirement: >
    A profile-defined opaque class in 0x40-0x7F that the profile declares is handled
    exactly as 0x01: stored and served byte-identically, never parsed, admitted only
    by a role that names it, and eligible as a prune target. One the profile has not
    declared is refused unsupported_op_class.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_op_class, role_forbids_op_class]
  test: tests/conformance/test_wire.py::test_profile_opaque_classes

- id: CONF-WIRE-012
  requirement: >
    The extension range is disabled by default: on a server implementing none, an op
    in 0xC0-0xFF is refused unsupported_op_class, and the whole suite still passes
    with such ops present in the log from an earlier deployment.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [unsupported_op_class]
  test: tests/conformance/test_wire.py::test_extension_range_default_off

- id: CONF-WIRE-013
  requirement: >
    An extension class is bound only from the position of its author's own ext_binding:
    an op of that class at any earlier position is refused ext_class_not_active, a batch
    of [ext_binding, ext op] is accepted, and [ext op, ext_binding] is refused at index
    0. An op after the binding's write-once end position is likewise refused.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_active]
  test: tests/conformance/test_wire.py::test_extension_binding_is_positional

- id: CONF-WIRE-014
  requirement: >
    An ext_binding naming a class this server implements, but under a different NAME, is
    refused ext_name_mismatch carrying the expected name, and no binding is recorded.
    Replaying a log written against another implementation's 0xC0 therefore fails at its
    first ext_binding rather than processing those ops under the wrong meaning.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_name_mismatch]
  test: tests/conformance/test_wire.py::test_extension_name_must_match

- id: CONF-WIRE-015
  requirement: >
    Bindings are member-scoped and are the binding of record. Member B's binding for a
    class does not bind member A: A's op of that class is refused ext_class_not_active
    while A holds no binding of its own, never judged against B's. And after the server's
    implementation of that class is reconfigured to a different NAME, a further op from a
    member whose recorded binding names the old one is refused ext_name_mismatch rather
    than reinterpreted.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_active, ext_name_mismatch]
  test: tests/conformance/test_wire.py::test_binding_is_member_scoped_and_of_record

- id: CONF-WIRE-016
  requirement: >
    A client refuses to author an op of an extension class for which it holds no live
    binding of its own carrying the name it believes, and does not infer one from another
    member's binding.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_extensions.py::test_no_authoring_without_own_binding

- id: CONF-WIRE-017
  requirement: >
    ext_binding shape rules are refused at decode: an unrecognised key, a missing type,
    op_class or (on bind) name, a name present on an unbind, an op_class outside
    192-255, and a name failing the token pattern or length. An unknown type is
    unsupported_ext_binding_type carrying type.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [malformed_ext_binding_payload, unsupported_ext_binding_type]
  test: tests/conformance/test_extensions.py::test_binding_shape_rules

- id: CONF-WIRE-018
  requirement: >
    bind is refused per cause in order: ext_class_not_enabled for a class the deployment
    does not permit, ext_name_mismatch for one it implements under another name, and 409
    ext_class_already_bound when this member already holds a live binding for it.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_enabled, ext_name_mismatch, ext_class_already_bound]
  test: tests/conformance/test_extensions.py::test_bind_causes

- id: CONF-WIRE-019
  requirement: >
    unbind is looked up under (Workspace, author, op_class): with no live binding it is
    ext_class_not_bound, and another member's live binding is likewise not found. After
    an unbind the member may bind the class again, under the same name or a different
    one, and ops are judged against the interval their position falls in.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [ext_class_not_bound, ext_class_not_active]
  test: tests/conformance/test_extensions.py::test_unbind_and_rebind_intervals

- id: CONF-WIRE-020
  requirement: >
    Suite 0x01 with op_class 0xBF, or with any other server-read class that is not 0x80
    or 0x81, gives encrypted_server_read_op.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [encrypted_server_read_op]
  test: tests/conformance/test_wire.py::test_sealed_server_read_classes

# ── Credentials ──────────────────────────────────────────────────────────────

- id: CONF-CRED-001
  requirement: >
    A refresh token presented as a bearer access token on a device route answers 401
    invalid_credential; the two flavours are not interchangeable.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_credential]
  test: tests/conformance/test_credentials.py::test_access_token_separation

- id: CONF-CRED-002
  requirement: >
    An access token presented to the refresh route, and a refresh token scoped to a
    different device, each answer 401 invalid_refresh_token.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token]
  test: tests/conformance/test_credentials.py::test_refresh_token_separation

- id: CONF-CRED-003
  requirement: "A refresh token rotates: the presented token is revoked and a fresh pair issued."
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_refresh_token]
  test: tests/conformance/test_credentials.py::test_refresh_rotation

- id: CONF-CRED-004
  requirement: A live refresh token cannot be reconstructed from server storage.
  spec: "docs/02-identity.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_credentials.py::test_refresh_stored_irreversibly

- id: CONF-CRED-005
  requirement: "Every 401 response carries WWW-Authenticate: Bearer."
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [invalid_credential, invalid_refresh_token, bad_member_challenge]
  test: tests/conformance/test_credentials.py::test_www_authenticate

- id: CONF-CRED-006
  requirement: >
    POST /v1/members is gated by the Root-signed certificate in its body and consults
    no stored Root: a certificate whose root_pk does not derive the Workspace it names
    answers 403 workspace_not_reachable, and one Root did not sign answers 422
    bad_root_signature — both before any Workspace exists.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [workspace_not_reachable, bad_root_signature]
  test: tests/conformance/test_credentials.py::test_registration_is_certificate_gated

- id: CONF-CRED-007
  requirement: >
    A member challenge is consumed by the attempt whether or not the signature
    verifies, and a second use of the same nonce answers bad_member_challenge.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [bad_member_challenge]
  test: tests/conformance/test_member_auth.py::test_challenge_consumed_on_attempt

- id: CONF-CRED-008
  requirement: >
    POST /v1/members/{m}/challenge for an unregistered id answers 404 unknown_member
    and creates no rate counter, so a subsequent registration is not pre-limited.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [unknown_member, member_challenge_rate_limited]
  test: tests/conformance/test_member_auth.py::test_existence_before_counter

# ── Authorization ────────────────────────────────────────────────────────────

- id: CONF-AUTHZ-001
  requirement: >
    Exhaustive route x principal matrix: every route in §3.7 against no credential, a
    User token, a member token with zero Grants, a member token per role, and a member
    token with all Grants revoked, each yielding the documented status.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [invalid_credential, no_registration, no_live_grant, role_forbids_op_class, keywrap_requires_owner]
  test: tests/conformance/test_authz_matrix.py::test_full_matrix

- id: CONF-AUTHZ-002
  requirement: >
    A device with no accepted registration in a Workspace answers 403 no_registration
    on every Workspace-scoped device route, before any other check.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_registration]
  test: tests/conformance/test_authz_matrix.py::test_access_gate_first

- id: CONF-AUTHZ-013
  requirement: >
    The access gate is per Workspace: a device registered in W1 and not W2 is served
    W1 and answers 403 no_registration for W2, though one Root founded both.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_registration]
  test: tests/conformance/test_authz_matrix.py::test_access_is_per_workspace

- id: CONF-AUTHZ-014
  requirement: >
    An author's first op in a Workspace is exempt from the access gate: a
    member_register naming the author, and a workspace_genesis, are both accepted from
    a device holding no registration there.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_authz_matrix.py::test_first_op_exempt

- id: CONF-AUTHZ-015
  requirement: >
    The exemption is not a hole: a member_register whose certificate was not signed by
    this Workspace's current Root answers 422 bad_root_signature.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [bad_root_signature]
  test: tests/conformance/test_authz_matrix.py::test_first_op_still_certified

# ── Shared Workspaces ────────────────────────────────────────────────────────

- id: CONF-SHARE-001
  requirement: >
    A device whose holder_root_pk differs from the Workspace's Root is registered,
    granted and able to write, given a registration this Workspace's Root signed.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_sharing.py::test_cross_identity_member

- id: CONF-SHARE-002
  requirement: >
    holder_root_pk is stored and returned verbatim on GET /v1/w/{w}/members, and the
    server branches on it nowhere.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_sharing.py::test_holder_is_opaque

- id: CONF-SHARE-003
  requirement: >
    Grants stay device-granular across identities: granting one of a holder's devices
    and not another is accepted, and the ungranted one is refused role_forbids_op_class
    or no_live_grant.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_sharing.py::test_per_device_grants_across_holders

- id: CONF-SHARE-004
  requirement: >
    No certificate carries a human-readable identifier: registration payloads are
    refused malformed_control_payload on any field outside the declared set.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [malformed_control_payload]
  test: tests/conformance/test_sharing.py::test_no_names_in_certificates

- id: CONF-AUTHZ-003
  requirement: >
    A member with zero Grants passes the member-GET bar; a member with at least one
    Grant and none live is refused no_live_grant with revoked=true.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_authz_matrix.py::test_pregrant_vs_revoked

- id: CONF-AUTHZ-004
  requirement: >
    Revocation is per Workspace: a member revoked in one reachable Workspace still
    passes the member-GET bar in the other.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_authz_matrix.py::test_revocation_scoped_per_workspace

- id: CONF-AUTHZ-005
  requirement: >
    A Root-signed control payload from a member with zero Grants is accepted; a rotate
    from the same member is refused 403 no_live_grant.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_authz_matrix.py::test_root_signed_bypass_is_narrow

- id: CONF-AUTHZ-006
  requirement: >
    An op class the granted role does not admit is refused 403 role_forbids_op_class
    carrying op_class and the sorted live roles.
  spec: "docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [role_forbids_op_class]
  test: tests/conformance/test_authz_matrix.py::test_role_matrix

- id: CONF-AUTHZ-007
  requirement: >
    At current_epoch=3: epoch 3 accepted, epoch 2 accepted, epoch 1 refused 409
    key_epoch_stale, epoch 4 refused 409 key_epoch_unknown. In an unkeyed Workspace no
    epoch is refused.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [key_epoch_stale, key_epoch_unknown]
  test: tests/conformance/test_epoch_floor.py::test_floor_and_ceiling

- id: CONF-AUTHZ-008
  requirement: An owner Grant not granted by root is refused owner_grant_requires_root.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [owner_grant_requires_root]
  test: tests/conformance/test_control.py::test_owner_mint_ceiling

- id: CONF-AUTHZ-009
  requirement: An owner Grant revoked by anything but root is refused owner_revoke_requires_root.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [owner_revoke_requires_root]
  test: tests/conformance/test_control.py::test_owner_revoke_ceiling

- id: CONF-AUTHZ-010
  requirement: An unrecognised role token is refused unknown_role, never ignored.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [unknown_role]
  test: tests/conformance/test_control.py::test_unknown_role

- id: CONF-AUTHZ-011
  requirement: A member_kind outside the profile's set is refused unknown_member_kind.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [unknown_member_kind]
  test: tests/conformance/test_control.py::test_unknown_member_kind

- id: CONF-AUTHZ-012
  requirement: >
    A Grant the profile's admissibility predicate rejects is refused
    member_kind_forbidden carrying member_kind.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [member_kind_forbidden]
  test: tests/conformance/test_control.py::test_grant_admissibility

# ── Member registry ──────────────────────────────────────────────────────────

- id: CONF-MEM-001
  requirement: POST /v1/members answers 201 on create and 200 with an identical body on an identical repeat.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_members.py::test_create_then_idempotent_repeat

- id: CONF-MEM-002
  requirement: >
    POST /v1/members refuses malformed keys and a key_id that is not the derivation.
  spec: "docs/02-identity.md"
