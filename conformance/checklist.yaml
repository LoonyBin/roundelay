  spec: "docs/01-the-log.md §11"
  subject: server
  observable: black-box
  codes: [workspace_quota_exhausted]
  test: tests/conformance/test_quota.py::test_the_two_exempt_classes

# ── Profile ──────────────────────────────────────────────────────────────────

- id: CONF-PROF-001
  requirement: A server refuses to start with any profile obligation unset.
  spec: "docs/reference/profile-obligations.md"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_no_defaults

- id: CONF-PROF-002
  requirement: >
    PROTOCOL_NAMESPACE matches its pattern, is 1-32 bytes, contains no slash, and is
    reported unchanged in GET /health.
  spec: "docs/04-keys.md"
  subject: profile
  observable: black-box
  codes: []
  test: tests/conformance/test_profile.py::test_the_namespace_is_reported_unchanged

- id: CONF-PROF-003
  requirement: >
    Under a derived creation policy a Workspace id is uuid8(NS, root_pk): the first 16
    bytes of SHA-256 over the 16 namespace bytes concatenated with the 32 raw bytes of
    the founding Root public key, with octet 6 replaced by 0x80 | (octet 6 & 0x0F) and
    octet 8 by 0x80 | (octet 8 & 0x3F) — never SHA-1, never a hex or base64 spelling of
    the key — asserted against frozen vectors. A genesis naming an id derived any other
    way answers 403 workspace_not_reachable, and the namespaces are frozen literals in
    the profile rather than values recomputed at startup, so one (root_pk, id) pair
    answers identically across a restart.
  spec: "docs/03-authority.md §3.1"
  subject: profile
  observable: black-box
  codes: [workspace_not_reachable]
  test: tests/conformance/test_profile.py::test_an_id_derived_any_other_way_is_not_reachable

- id: CONF-PROF-004
  requirement: The role table contains exactly one role named owner.
  spec: "docs/03-authority.md"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_single_authority_role

- id: CONF-PROF-005
  requirement: >
    The profile declares a holder_ref derivation, and every registration the
    deployment's own clients write uses it, so two devices held by one identity carry
    equal holder_ref within a Workspace.
  spec: "docs/reference/profile-obligations.md"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_holder_ref_groups_a_holders_devices

- id: CONF-PROF-006
  requirement: >
    Every role token in the profile's initial table matches
    ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ and is 1-32 bytes — the protocol's one token shape,
    and the shape a role_table certificate is held to — so no initial table names a role
    an in-band replacement could not carry.
  spec: "docs/03-authority.md §7, §10"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_initial_role_tokens_match_pattern

