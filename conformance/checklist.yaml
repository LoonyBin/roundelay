  requirement: >
    Epoch 0 requires keywrap_digest when no record exists (missing_keywrap_digest
    otherwise) and ignores it once one does, so a byte-identical replay without it
    answers 200.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [missing_keywrap_digest, malformed_keywrap_digest]
  test: tests/conformance/test_keyplane.py::test_epoch_zero_digest

- id: CONF-KEY-004
  requirement: A byte-identical re-upload answers 200; a different set for a written epoch is refused.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch, keywrap_already_written]
  test: tests/conformance/test_keyplane.py::test_replay_and_replacement

- id: CONF-KEY-005
  requirement: >
    Per-entry validation is refused with index: malformed wrap, malformed kex_key_id, an
    unknown member, an unregistered kex_key_id, and a duplicate member.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [malformed_keywrap, malformed_kex_key_id, unknown_keywrap_member, kex_key_id_not_registered, duplicate_keywrap_member]
  test: tests/conformance/test_keyplane.py::test_entry_validation

- id: CONF-KEY-006
  requirement: A malformed escrow wrap or an out-of-range epoch is refused before authorization-independent work.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [malformed_escrow_wrap, malformed_key_epoch]
  test: tests/conformance/test_keyplane.py::test_top_level_validation

- id: CONF-KEY-007
  requirement: A non-authority member uploading wraps is refused 403 keywrap_requires_owner with revoked.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [keywrap_requires_owner]
  test: tests/conformance/test_keyplane.py::test_owner_only

- id: CONF-KEY-008
  requirement: >
    GET keywraps/me returns only the calling Member's wraps, every epoch, ordered by
    epoch ascending.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_keyplane.py::test_own_wraps_only

- id: CONF-KEY-009
  requirement: >
    GET epoch-keys requires any live Grant, is ordered by epoch ascending, and omits
    epochs whose escrow wrap has not been uploaded.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_keyplane.py::test_epoch_keys

- id: CONF-KEY-010
  requirement: Two concurrent uploads of one epoch resolve idempotently or with a documented refusal, never a 500.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [keywrap_digest_mismatch, keywrap_already_written]
  test: tests/conformance/test_races.py::test_concurrent_wrap_uploads

# ── Discipline ───────────────────────────────────────────────────────────────

- id: CONF-DISC-001
  requirement: >
    Every refusal on every core route carries {"detail": {"code": ...}}; no route
    returns a bare string detail.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_discipline.py::test_error_shape_uniform

- id: CONF-DISC-002
  requirement: Every per-op refusal on POST ops carries the zero-based batch index.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_discipline.py::test_index_on_per_op

- id: CONF-DISC-003
  requirement: Every 429 carries retry_after_seconds.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [member_challenge_rate_limited, vault_fetch_rate_limited]
  test: tests/conformance/test_discipline.py::test_retry_after_present

- id: CONF-DISC-004
  requirement: >
    No code outside Appendix A is emitted by any route under any input in the
    conformance corpus.
  spec: "docs/05-compatibility.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_discipline.py::test_no_unlisted_codes

- id: CONF-DISC-005
  requirement: >
    No documented race yields a 500; the only 5xx in the suite is
    GET /health/db's 503.
  spec: "docs/README.md"
  subject: server
  observable: black-box
  codes: [store_unavailable]
  test: tests/conformance/test_discipline.py::test_no_five_hundreds

- id: CONF-DISC-006
  requirement: Bodies of any class with bit 7 clear are never parsed.
  spec: "docs/README.md"
  subject: server
  observable: white-box
  codes: []
  test: tests/conformance/test_discipline.py::test_no_content_parsing

# ── Profile ──────────────────────────────────────────────────────────────────

- id: CONF-PROF-001
  requirement: A server refuses to start with any Appendix C obligation unset.
  spec: "docs/reference/profile-obligations.md"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_no_defaults

- id: CONF-PROF-002
  requirement: >
    PROTOCOL_NAMESPACE matches its pattern, is 1-32 bytes, contains no slash, and is
    reported unchanged in GET /health.
  spec: "docs/04-keys.md"
  subject: profile
  observable: black-box
  codes: []
  test: tests/conformance/test_profile.py::test_namespace_constraints

- id: CONF-PROF-003
  requirement: >
    Under a derived creation policy, workspace ids are UUID-v5 over the frozen
    namespaces with the 32 raw bytes of the founding Root public key, asserted
    against frozen vectors.
  spec: "docs/03-authority.md"
  subject: profile
  observable: black-box
  codes: [workspace_not_reachable]
  test: tests/conformance/test_profile.py::test_derived_ids

- id: CONF-PROF-004
  requirement: The role table contains exactly one role named owner.
  spec: "docs/03-authority.md"
  subject: profile
  observable: white-box
  codes: []
  test: tests/conformance/test_profile.py::test_single_authority_role

# ── Client obligations ───────────────────────────────────────────────────────

- id: CONF-CLI-001
  requirement: A client verifies every pulled envelope's Ed25519 signature and refuses on failure.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: [bad_signature]
  test: tests/conformance/client/test_verification.py::test_signature_checked

- id: CONF-CLI-002
  requirement: A client verifies prev_author_hash against its own verified head.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_verification.py::test_chain_checked

- id: CONF-CLI-003
  requirement: A client refuses an op with a non-zero observed_head in v1.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_verification.py::test_observed_head_zero

- id: CONF-CLI-004
  requirement: A client verifies author_key_id against the key learned from that Member's registration.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_verification.py::test_key_id_checked

- id: CONF-CLI-005
  requirement: >
    A client enforces all three padding rules on every body it unframes, on the
    decrypted plaintext under suite 0x01.
  spec: "docs/01-the-log.md"
  subject: client
  observable: black-box
  codes: [invalid_body_length, payload_overruns_body, non_zero_padding]
  test: tests/conformance/client/test_framing.py::test_padding_rules

- id: CONF-CLI-006
  requirement: >
    A client refuses an opaque op (bit 7 clear) at suite 0x00 whose epoch it holds a
    key for, and raises aead_failure for a body that does not authenticate.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: [plaintext_at_encrypted_epoch, aead_failure]
  test: tests/conformance/client/test_suites.py::test_downgrade_and_aead

- id: CONF-CLI-007
  requirement: >
    A client refuses a non-genesis control op carrying a zero prev_control_hash, even
    when its own control state is empty.
  spec: "docs/03-authority.md"
  subject: client
  observable: black-box
  codes: [control_chain_break]
  test: tests/conformance/client/test_control.py::test_truncated_log_detected

- id: CONF-CLI-008
  requirement: >
    A client checks that the root_pk served with a vault record equals the Root it
    recovered from the blob, and treats a mismatch as a corrupt record rather than as
    a key to adopt.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_served_root_pk_cross_checked

- id: CONF-CLI-009
  requirement: A client does not treat a WebSocket accept as authentication success.
  spec: "docs/01-the-log.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_signal.py::test_accept_is_not_auth

- id: CONF-CLI-010
  requirement: >
    A client transmits no value derived from the wrapping secret except the locator:
    the secret itself appears in no request body, header, query parameter or log sink.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_secret_never_travels

- id: CONF-CLI-011
  requirement: >
    A client surfaces an unrecognised refusal code verbatim and does not fold it into
    another code's meaning.
  spec: "docs/05-compatibility.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_codes.py::test_unknown_code_surfaced

- id: CONF-CLI-012
  requirement: >
    A client terminalises every code Appendix A marks deterministic, and has no
    retry-by-default fallback for unrecognised codes.
  spec: "docs/05-compatibility.md"
  subject: client
  observable: black-box
  codes: [keywrap_digest_mismatch, genesis_not_first, unsupported_contract_version]
  test: tests/conformance/client/test_codes.py::test_terminalisation

- id: CONF-CLI-013
  requirement: >
    A client re-writing a vault slot carries the same master wrap key forward: after a
    credential change, epoch keys minted before the change still open from the new
    record.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_master_wrap_key_survives_rewrite

- id: CONF-CLI-014
  requirement: >
    A client does not derive the master wrap key from Root: after a root_handover and
    the vault re-write that follows it, every escrow wrap minted before the handover
    still opens.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_master_wrap_key_survives_handover

# ── Admission ────────────────────────────────────────────────────────────────

- id: CONF-ADM-001
  requirement: >
    A POST /v1/members carrying a workspace_genesis certificate that the server
    declines to admit answers 403 admission_refused, and no member record is created.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [admission_refused]
  test: tests/conformance/test_admission.py::test_founding_registration_gated

- id: CONF-ADM-002
  requirement: >
    Admission is consulted at founding registration and nowhere else: with the gate
    closed after a Workspace exists, genesis of a second Workspace, grants, ops,
    keywraps and vault writes all still succeed.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_admission.py::test_gate_is_registration_only

- id: CONF-ADM-003
  requirement: >
    A joining device registers with no admission credential: a member_register
    certificate for an existing Workspace, signed by that Workspace's current Root,
    is accepted with the gate closed.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_admission.py::test_joining_is_self_admitting

- id: CONF-ADM-007
  requirement: >
    The joining branch is checked, not assumed: a member_register certificate for a
    Workspace that does not exist answers 409 workspace_not_created, and one signed by
    a Root that is not that Workspace's current Root answers 422 cert_root_pk_mismatch.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [workspace_not_created, cert_root_pk_mismatch]
  test: tests/conformance/test_admission.py::test_joining_branch_verified

- id: CONF-ADM-008
  requirement: >
    Certificate type alone selects the branch: a workspace_genesis certificate takes
    the admitted path even when that Workspace already exists, and the server performs
    no Workspace lookup to decide.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [admission_refused]
  test: tests/conformance/test_admission.py::test_branch_is_syntactic

- id: CONF-ADM-004
  requirement: >
    A first vault write by a Root that has founded no Workspace answers 403
    vault_requires_genesis; the same write succeeds once its genesis has landed.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [vault_requires_genesis]
  test: tests/conformance/test_vault.py::test_first_write_requires_genesis

- id: CONF-ADM-005
  requirement: >
    A later vault write is never admission-checked: a re-wrap succeeds against a slot
    whose Root still holds its Workspace, with the gate closed.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_vault.py::test_rewrite_not_admission_checked

- id: CONF-CLI-015
  requirement: >
    A founding client lands its workspace_genesis before writing the vault slot that
    recovers it.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: [vault_requires_genesis]
  test: tests/conformance/client/test_vault.py::test_genesis_before_vault

- id: CONF-ADM-006
  requirement: >
    The Roundelay-Admission header is honoured only on POST /v1/members: it is ignored
    on every other route and is never accepted in place of a device access token.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_credential]
  test: tests/conformance/test_admission.py::test_header_scoped_to_registration

# ── Delegation ───────────────────────────────────────────────────────────────

- id: CONF-DELG-001
  requirement: >
    A delegate signed by a live delegate rather than by Root itself answers 422
    bad_root_signature; the same for revoke_delegation.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [bad_root_signature]
  test: tests/conformance/test_delegation.py::test_delegate_cannot_delegate

- id: CONF-DELG-002
  requirement: >
    A member_register, grant or revoke certificate signed by a live delegate is
    accepted exactly as a Root-signed one, including an owner grant and its revoke.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_delegation.py::test_delegate_holds_root_authority

- id: CONF-DELG-003
  requirement: >
    A workspace_genesis, root_handover or vault write signed by a live delegate is
    refused; only Root itself is accepted for those three.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [bad_root_signature, bad_vault_signature]
  test: tests/conformance/test_delegation.py::test_three_exclusions

- id: CONF-DELG-004
  requirement: >
    The delegation verdict is positional: a certificate signed by a delegate is judged
    against the delegations live where that certificate's own op landed, so a
    revoke_delegation invalidates nothing already signed.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_delegation.py::test_positional_and_not_retroactive

- id: CONF-DELG-005
  requirement: >
    A second op reusing a delegation_id answers 409 delegation_id_already_used, and a
    revoke_delegation naming no known delegation answers 422 unknown_delegation.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [delegation_id_already_used, unknown_delegation]
  test: tests/conformance/test_delegation.py::test_delegation_ids

- id: CONF-DELG-006
  requirement: >
    A delegate naming a device's registered signing key in this Workspace, or the
    Workspace's current Root, is refused.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [bad_root_signature, malformed_root_pk]
  test: tests/conformance/test_delegation.py::test_delegate_key_disjoint

# ── Device key split ─────────────────────────────────────────────────────────

- id: CONF-DKEY-001
  requirement: >
    A server-read envelope carrying the content key id, and an opaque envelope
    carrying the control key id, each answer 422 author_key_class_mismatch.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [author_key_class_mismatch]
  test: tests/conformance/test_device_keys.py::test_key_matches_class

- id: CONF-DKEY-002
  requirement: >
    The auth challenge is answered by the control key: a signature by the content key
    answers 401 bad_member_challenge.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [bad_member_challenge]
  test: tests/conformance/test_device_keys.py::test_challenge_takes_control_key

- id: CONF-DKEY-003
  requirement: >
    Registration carries both signing keys and all three key ids are the server's own
    derivations; a claimed id that disagrees answers 422
    key_id_not_derived_from_sign_pk.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [key_id_not_derived_from_sign_pk]
  test: tests/conformance/test_device_keys.py::test_both_keys_registered

# ── Revocation reach ─────────────────────────────────────────────────────────

- id: CONF-REVK-001
  requirement: >
    A revoked device is refused no_live_grant on every bar-1 route, for old ops as
    well as new, and its refresh tokens no longer refresh.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant, invalid_refresh_token]
  test: tests/conformance/test_revocation.py::test_revoked_cannot_pull

- id: CONF-REVK-002
  requirement: >
    A revoke closes grants and not the registration: the device still appears in GET
    /v1/w/{w}/members and still passes the access gate while failing bar 1.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_revocation.py::test_registration_survives_revoke

- id: CONF-REVK-003
  requirement: >
    A rotate after a revoke mints the new epoch's wrap set without the revoked device,
    so no wrap for the new epoch is served to it.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_revocation.py::test_rotate_excludes_revoked
