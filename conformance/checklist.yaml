- id: CONF-CLI-017
  requirement: >
    A client does not treat include_reprised=true as a retention promise: it keeps its
    own copy of any history it requires, and tolerates an op present in that view on
    one read and absent on a later one.
  spec: "docs/01-the-log.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_verification.py::test_history_view_not_durable

- id: CONF-CLI-004
  requirement: >
    A client verifies author_key_id against the key in force for that Member at the op's
    own position — the one its registration named, until a member_amend replaces it.
  spec: "docs/01-the-log.md, docs/03-authority.md §10"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_verification.py::test_key_id_checked

- id: CONF-CLI-026
  requirement: >
    Key replacement is positional in both directions for a reader. Given a
    member_amend{control} at seq 13, the client verifies that device's bit-7-set
    envelopes below 13 under the replaced control key and those above 13 under the new
    one, and refuses neither. An author_key_id that resolves to no key in force for that
    device at that op's position is refused unknown_author_key — the op is not
    authentic, and the code is never folded into bad_signature.
  spec: "docs/03-authority.md §10"
  subject: client
  observable: white-box
  codes: [unknown_author_key, bad_signature]
  test: tests/conformance/client/test_verification.py::test_key_resolution_is_positional

- id: CONF-CLI-005
  requirement: >
    A client enforces all three padding rules on every body it unframes, on the
    decrypted plaintext under suite 0x01.
  spec: "docs/01-the-log.md"
  subject: client
  observable: white-box
  codes: [invalid_body_length, payload_overruns_body, non_zero_padding]
  test: tests/conformance/client/test_framing.py::test_padding_rules

- id: CONF-CLI-006
  requirement: >
    The downgrade test is positional. A client refuses an opaque op (bit 7 clear) at
    suite 0x00 plaintext_at_encrypted_epoch when it sits at a log position after the
    Workspace's first rotate, and at any position where the Workspace's epoch 0 is
    keyed — while accepting the same op at a position before the first rotate in a
    Workspace that shipped plaintext and encrypted later. It raises aead_failure for a
    body that does not authenticate.
  spec: "docs/04-keys.md §3"
  subject: client
  observable: white-box
  codes: [plaintext_at_encrypted_epoch, aead_failure]
  test: tests/conformance/client/test_suites.py::test_downgrade_and_aead

- id: CONF-CLI-028
  requirement: >
    A client refuses a pulled envelope whose suite byte it does not serve before
    trusting any offset beyond the two selector bytes: the body geometry and the
    signature length are the suite's, so it computes no body boundary, no envelope hash
    and no signature verdict for such an envelope, and keeps the bytes rather than
    discarding them.
  spec: "docs/05-compatibility.md §5, docs/01-the-log.md §2"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_suites.py::test_unserved_suite_refused_before_offsets

- id: CONF-CLI-007
  requirement: >
    A client refuses a non-genesis control op carrying a zero prev_control_hash, even
    when its own control state is empty.
  spec: "docs/03-authority.md"
  subject: client
  observable: white-box
  codes: [control_chain_break]
  test: tests/conformance/client/test_control.py::test_truncated_log_detected

- id: CONF-CLI-021
  requirement: >
    A client served a control log with a middle op removed rejects it as truncated or
    tampered: the surviving links no longer form one unbroken chain from genesis, and
    the ops either side of the hole are not replayed as a valid history, though every
    one of them verifies on its own.
  spec: "docs/03-authority.md"
  subject: client
  observable: white-box
  codes: [control_chain_break]
  test: tests/conformance/client/test_control.py::test_middle_op_removal_detected

- id: CONF-CLI-022
  requirement: >
    On control_chain_break a client that can read the Workspace pulls the control log
    again before rebuilding, rather than re-linking against the returned
    expected_prev_control_hash: a GET …/ops appears between the refusal and the next
    POST …/ops.
  spec: "docs/03-authority.md §10"
  subject: client
  observable: black-box
  codes: [control_chain_break]
  test: tests/conformance/client/test_control.py::test_rebuild_re_reads_the_log

- id: CONF-CLI-024
  requirement: >
    A reader replaying the control log that meets a load-bearing control type it does
    not serve stops deriving authority at that position and does not skip it: everything
    derived below stands, and no authority-dependent verdict — a grant, a revocation, a
    delegation, the current Root — is produced for any later position. The condition is
    surfaced as control_type_not_served, the op's chain link is still verified so the
    reader knows where it stopped, and nothing is refetched or quarantined.
  spec: "docs/03-authority.md §4"
  subject: client
  observable: white-box
  codes: [control_type_not_served]
  test: tests/conformance/client/test_control.py::test_unserved_control_type_halts

- id: CONF-CLI-025
  requirement: >
    A reader that meets a control type it does not serve whose name begins note_
    hash-chains past it without interpreting it: it derives nothing from the payload,
    reads no field of it but the mandatory type, produces authority verdicts for every
    later position as though the op carried none, and raises no
    control_type_not_served.
  spec: "docs/03-authority.md §4"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_control.py::test_advisory_type_chained_past

- id: CONF-CLI-008
  requirement: >
    A client checks that the root_pk served with a vault record equals the Root it
    recovered from the blob, and treats a mismatch as a corrupt record rather than as
    a key to adopt.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_served_root_pk_cross_checked

- id: CONF-CLI-009
  requirement: A client does not treat a WebSocket accept as authentication success.
  spec: "docs/01-the-log.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_signal.py::test_accept_is_not_auth

- id: CONF-CLI-010
  requirement: >
    A client transmits no value derived from the wrapping secret except the locator:
    the secret itself appears in no request body, header, query parameter or log sink.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_secret_never_travels

- id: CONF-CLI-011
  requirement: >
    A client surfaces an unrecognised refusal code verbatim and does not fold it into
    another code's meaning.
  spec: "docs/05-compatibility.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_codes.py::test_unknown_code_surfaced

- id: CONF-CLI-027
  requirement: >
    A client tolerates unrecognised response members at any nesting depth, including
    inside a refusal detail object beside a code it does know: it proceeds exactly as it
    proceeds against the same response without them, refusing neither the response nor
    the refusal, and no later request it sends carries any of those members back.
  spec: "docs/05-compatibility.md §4"
  subject: client
  observable: black-box
  codes: []
  test: tests/conformance/client/test_codes.py::test_unknown_response_members_tolerated

- id: CONF-CLI-012
  requirement: >
    A client terminalises every code docs/reference/refusal-codes.md marks
    deterministic, and has no retry-by-default fallback for unrecognised codes.
  spec: "docs/05-compatibility.md"
  subject: client
  observable: black-box
  codes: [keywrap_digest_mismatch, genesis_not_first, unsupported_contract_version]
  test: tests/conformance/client/test_codes.py::test_terminalisation

- id: CONF-CLI-013
  requirement: >
    A client re-writing a vault slot carries the same master wrap key forward: after a
    credential change, epoch keys minted before the change still open from the new
    record.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_master_wrap_key_survives_rewrite

- id: CONF-CLI-014
  requirement: >
    A client does not derive the master wrap key from Root: after a root_handover and
    the vault re-write that follows it, every escrow wrap minted before the handover
    still opens.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_vault.py::test_master_wrap_key_survives_handover

- id: CONF-CLI-019
  requirement: >
    A client does not author a rotate unless it holds the Workspace's founding master
    wrap key, and seals the new epoch's escrow wrap under that key.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_keyplane.py::test_rotate_requires_master_wrap_key

- id: CONF-CLI-020
  requirement: >
    A client seals every new op at the newest epoch it holds a key for, and writes at a
    lower epoch only to drain ops it had already signed when the rotation landed.
  spec: "docs/04-keys.md"
  subject: client
  observable: white-box
  codes: []
  test: tests/conformance/client/test_keyplane.py::test_seals_at_newest_epoch

# ── Admission ────────────────────────────────────────────────────────────────

- id: CONF-ADM-001
  requirement: >
    A POST /v1/members carrying a workspace_genesis certificate that the server
    declines to admit answers 403 admission_refused, and no member record is created.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [admission_refused]
  test: tests/conformance/test_admission.py::test_a_founding_registration_the_server_declines

- id: CONF-ADM-002
  requirement: >
    Admission is consulted at founding registration and nowhere else: with the gate
    closed after a Workspace exists, genesis of a second Workspace, grants, ops,
    keywraps and vault writes all still succeed.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_admission.py::test_the_gate_is_consulted_at_founding_and_nowhere_else

- id: CONF-ADM-003
  requirement: >
    A joining device registers with no admission credential: a member_register
    certificate for an existing Workspace, signed under that Workspace's root
    authority — its current Root, or a delegation live as the route evaluates the
    request — is accepted with the gate closed.
  spec: "docs/02-identity.md §4"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_admission.py::test_a_delegate_signed_registration_needs_no_admission

- id: CONF-ADM-007
  requirement: >
    The joining branch is checked, not assumed: a member_register certificate for a
    Workspace that does not exist answers 409 workspace_not_created, and one signed by
    a Root that is not that Workspace's current Root answers 422 cert_root_pk_mismatch.
    A delegate-signed certificate whose root_pk_b64 is not the current Root answers
    cert_root_pk_mismatch too — the signature verified under a live delegation, so it
    is never bad_root_signature.
  spec: "docs/02-identity.md §4"
  subject: server
  observable: black-box
  codes: [workspace_not_created, cert_root_pk_mismatch]
  test: tests/conformance/test_admission.py::test_a_delegate_signature_under_the_wrong_root_names_the_root

- id: CONF-ADM-008
  requirement: >
    Certificate type alone selects the branch: a workspace_genesis certificate takes
    the admitted path even when the Workspace it names already exists: with the gate
    closed the verdict is 403 admission_refused, never the joining branch's
    workspace_not_created or cert_root_pk_mismatch.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [admission_refused, workspace_not_created, cert_root_pk_mismatch]
  test: tests/conformance/test_admission.py::test_the_certificate_type_selects_the_branch

- id: CONF-ADM-004
  requirement: >
    A first vault write by a Root that has founded no Workspace answers 403
    vault_requires_genesis; the same write succeeds once its genesis has landed.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: [vault_requires_genesis]
  test: tests/conformance/test_admission.py::test_a_vault_write_by_a_root_that_founded_nothing

- id: CONF-ADM-005
  requirement: >
    A later vault write is never admission-checked: a re-wrap succeeds against a slot
    whose Root still holds its Workspace, with the gate closed.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_admission.py::test_a_later_vault_write_is_never_admission_checked

- id: CONF-CLI-015
  requirement: >
    A founding client lands its workspace_genesis before writing the vault slot that
    recovers it.
  spec: "docs/04-keys.md"
  subject: client
  observable: black-box
  codes: [vault_requires_genesis]
  test: tests/conformance/client/test_vault.py::test_genesis_before_vault

- id: CONF-ADM-006
  requirement: >
    The Roundelay-Admission header is honoured only on POST /v1/members: it is ignored
    on every other route and is never accepted in place of a device access token.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [invalid_credential]
  test: tests/conformance/test_admission.py::test_the_admission_header_is_honoured_on_one_route

# ── Delegation ───────────────────────────────────────────────────────────────

- id: CONF-DELG-001
  requirement: >
    A delegate signed by a live delegate rather than by Root itself answers 422
    bad_root_signature; the same for revoke_delegation.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [bad_root_signature]
  test: tests/conformance/test_authority.py::test_a_delegate_may_not_delegate

- id: CONF-DELG-002
  requirement: >
    A member_register, grant or revoke certificate signed by a live delegate is
    accepted exactly as a Root-signed one, including an owner grant and its revoke.
    The route agrees with the log: a delegate-signed member_register presented at
    POST /v1/members with root_pk_b64 set to that Workspace's current Root answers 201.
  spec: "docs/03-authority.md §6, docs/02-identity.md §4"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_authority.py::test_a_delegate_signs_registrations_and_grants

- id: CONF-DELG-003
  requirement: >
    A workspace_genesis, root_handover, role_table or vault write signed by a live
    delegate is refused; only Root itself is accepted for those four.
  spec: "docs/03-authority.md §6"
  subject: server
  observable: black-box
  codes: [bad_root_signature, bad_vault_signature]
  test: tests/conformance/test_authority.py::test_four_documents_are_roots_alone

- id: CONF-DELG-004
  requirement: >
    The delegation verdict is positional: a certificate signed by a delegate is judged
    against the delegations live where that certificate's own op landed, so a
    revoke_delegation invalidates nothing already signed.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_authority.py::test_the_delegation_verdict_is_positional

- id: CONF-DELG-005
  requirement: >
    A second op reusing a delegation_id answers 409 delegation_id_already_used, and a
    revoke_delegation naming no known delegation answers 422 unknown_delegation.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [delegation_id_already_used, unknown_delegation]
  test: tests/conformance/test_authority.py::test_delegation_ids_are_once

- id: CONF-DELG-006
  requirement: >
    A delegate naming a device's registered signing key in this Workspace, or the
    Workspace's current Root, answers 422 delegate_pk_in_use — never
    bad_root_signature, whose signature verifies, and never malformed_root_pk, whose
    key is 32 bytes.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [delegate_pk_in_use]
  test: tests/conformance/test_authority.py::test_a_delegate_key_may_not_be_in_use

- id: CONF-DELG-007
  requirement: >
    The disjointness check is positional: a delegation whose key was nobody's
    registered signing key where it landed stays valid when a device registers that
    key afterwards, and the certificates it signed in between stay accepted.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_delegation.py::test_delegate_key_disjointness_is_positional

- id: CONF-DELG-008
  requirement: >
    A device enrols end to end under a delegation alone, Root never signing: the
    delegate-signed member_register certificate answers 201 at POST /v1/members with
    chained false, the challenge and token routes then issue a device token, the same
    certificate posted as that device's first op is accepted while it holds zero
    grants, and the device is chained thereafter.
  spec: "docs/03-authority.md §6, docs/02-identity.md §4"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_delegation.py::test_delegate_enrolment_end_to_end

- id: CONF-DELG-009
  requirement: >
    The route's verdict is a snapshot and the log's is positional. A certificate the
    route accepted while the delegation was live is refused 422 bad_root_signature
    when it lands as an op after a revoke_delegation; the shell persists, and a
    freshly issued certificate for the same keys answers 200 at the route and is
    accepted as that device's first op.
  spec: "docs/02-identity.md §4, docs/03-authority.md §6"
  subject: server
  observable: black-box
  codes: [bad_root_signature]
  test: tests/conformance/test_delegation.py::test_snapshot_versus_positional

# ── Device key split ─────────────────────────────────────────────────────────

- id: CONF-DKEY-001
  requirement: >
    A server-read envelope carrying the content key id, and an opaque envelope
    carrying the control key id, each answer 422 author_key_class_mismatch. The check
    lands in stage 1, header-only, before stage 2's permission checks: an op that is
    both class-mismatched and unauthorised answers author_key_class_mismatch, not
    no_live_grant.
  spec: "docs/03-authority.md, docs/01-the-log.md"
  subject: server
  observable: black-box
  codes: [author_key_class_mismatch, no_live_grant]
  test: tests/conformance/test_identity.py::test_the_key_class_must_match_the_op_class

- id: CONF-DKEY-002
  requirement: >
    The auth challenge is answered by the control key: a signature by the content key
    answers 401 bad_member_challenge.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [bad_member_challenge]
  test: tests/conformance/test_identity.py::test_a_challenge_is_spent_by_the_attempt

- id: CONF-DKEY-003
  requirement: >
    Registration carries both signing keys and all three key ids are the server's own
    derivations; a claimed id that disagrees answers 422
    key_id_not_derived_from_sign_pk.
  spec: "docs/02-identity.md"
  subject: server
  observable: black-box
  codes: [key_id_not_derived_from_sign_pk]
  test: tests/conformance/test_identity.py::test_a_claimed_key_id_must_be_the_derivation

# ── Revocation reach ─────────────────────────────────────────────────────────

- id: CONF-REVK-001
  requirement: >
    A revoked device is refused no_live_grant on every bar-1 route, for old ops as
    well as new, and its refresh tokens no longer refresh.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant, invalid_refresh_token]
  test: tests/conformance/test_revocation.py::test_revoked_cannot_pull

- id: CONF-REVK-002
  requirement: >
    A revoke closes grants and not the registration: the device still appears in GET
    /v1/w/{w}/members and still passes the access gate while failing bar 1.
  spec: "docs/03-authority.md"
  subject: server
  observable: black-box
  codes: [no_live_grant]
  test: tests/conformance/test_authority.py::test_revocation_leaves_the_registration

- id: CONF-REVK-003
  requirement: >
    A rotate after a revoke mints the new epoch's wrap set without the revoked device,
    so no wrap for the new epoch is served to it.
  spec: "docs/04-keys.md"
  subject: server
  observable: black-box
  codes: []
  test: tests/conformance/test_revocation.py::test_rotate_excludes_revoked
